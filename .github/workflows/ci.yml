name: Validate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run release:build
      - run: npm run release:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: cloudflare-release
          path: |
            release/*-cloudflare.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-release
          path: release
      - name: Verify and publish Cloudflare package
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" ./*-cloudflare.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Tedd’mhen $RELEASE_TAG"
